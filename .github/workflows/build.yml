name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on an x64 runner and cross-compiled: the engine is pure Rust,
          # so no ARM64 runner is needed.
          - label: ARM64
            target: aarch64-pc-windows-msvc
          # Next: Intel/AMD — uncomment to ship an x64 installer alongside.
          # - label: x64
          #   target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Engine tests
        run: cargo test -p stitch-core --release

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build installer
        working-directory: app
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AerialStitch-windows-${{ matrix.label }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/bundle/nsis/*.exe
